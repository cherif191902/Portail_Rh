<div class="login-page d-flex flex-wrap">

  <!-- Left side: Static image -->
<div class="image-side d-none d-md-flex align-items-center justify-content-center">
  <img src="assets/images/HR Final3.png" alt="Login Visual" class="login-image" />
</div>

  <!-- Right side: Login form -->
  <div class="form-side">
    <div class="login-card p-4">
      <div class="text-center mb-4">
        <img src="assets/images/HR Final4.png" alt="HR Connect" height="60" />
        <h2 class="mt-2">HR Connect</h2>
        <p class="text-muted">Connectez-vous pour continuer au portail.</p>
      </div>

      <form class="form-horizontal" *ngIf="!isLoggedIn" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div *ngIf="errr" class="alert alert-danger" role="alert">{{ errr }}</div>

        <div class="mb-3">
          <label for="matricule">Matricule</label>
          <input type="text" class="form-control" id="matricule" formControlName="matricule"
                 required placeholder="Entrer votre matricule" />
        </div>

        <div class="mb-3">
          <label for="password">Mot de passe</label>
          <div class="input-group auth-pass-inputgroup">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
                   formControlName="password" required minlength="6" placeholder="Entrer votre mot de passe" />
            <button type="button" class="btn btn-light" (click)="togglePasswordVisibility()" tabindex="-1">
              <i [ngClass]="showPassword ? 'mdi mdi-eye-off-outline' : 'mdi mdi-eye-outline'"></i>
            </button>
          </div>
        </div>

        <div class="mt-3 d-grid">
          <button class="btn btn-primary btn-block" type="submit">Connexion</button>
        </div>
      </form>

      <div class="text-center mt-4">
        <p>Vous n'avez pas de compte ?
          <a routerLink="/account/signup" class="fw-medium text-primary">Inscription</a>
        </p>
        <p class="text-muted">© {{year}} Développé par ArabSoft</p>
      </div>
    </div>
  </div>
</div>
