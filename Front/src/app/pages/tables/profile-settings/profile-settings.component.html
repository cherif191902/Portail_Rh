<div class="card border-0 shadow-lg" style="max-width: 800px; margin: 2rem auto;">
  <div class="card-body p-5">
    <div class="text-center mb-5">
      <h3 class="card-title fw-bold text-primary mb-1">Profile Settings</h3>
      <p class="text-muted">Manage your personal information</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <!-- Nom -->
      <div class="mb-4">
        <label class="form-label fw-medium text-dark">First Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="fas fa-user text-muted"></i>
          </span>
          <input type="text" 
                 class="form-control form-control-lg border-start-0"
                 formControlName="nom"
                 placeholder="Enter your first name">
        </div>
        <div *ngIf="profileForm.get('nom').invalid && profileForm.get('nom').touched" 
             class="text-danger small mt-2 d-flex align-items-center gap-1">
          <i class="fas fa-exclamation-circle"></i>
          First name is required
        </div>
      </div>

      <!-- Prenom -->
      <div class="mb-4">
        <label class="form-label fw-medium text-dark">Last Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="fas fa-user text-muted"></i>
          </span>
          <input type="text" 
                 class="form-control form-control-lg border-start-0"
                 formControlName="prenom"
                 placeholder="Enter your last name">
        </div>
        <div *ngIf="profileForm.get('prenom').invalid && profileForm.get('prenom').touched" 
             class="text-danger small mt-2 d-flex align-items-center gap-1">
          <i class="fas fa-exclamation-circle"></i>
          Last name is required
        </div>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="form-label fw-medium text-dark">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="fas fa-envelope text-muted"></i>
          </span>
          <input type="email" 
                 class="form-control form-control-lg border-start-0"
                 formControlName="email"
                 placeholder="name@example.com">
        </div>
        <div *ngIf="profileForm.get('email').invalid && profileForm.get('email').touched" 
             class="text-danger small mt-2 d-flex align-items-center gap-1">
          <i class="fas fa-exclamation-circle"></i>
          Valid email is required
        </div>
      </div>

      <!-- Phone -->
      <div class="mb-4">
        <label class="form-label fw-medium text-dark">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="fas fa-phone text-muted"></i>
          </span>
          <input type="text" 
                 class="form-control form-control-lg border-start-0"
                 formControlName="numTel"
                 placeholder="+216 00 000 000">
        </div>
        <div *ngIf="profileForm.get('numTel').invalid && profileForm.get('numTel').touched" 
             class="text-danger small mt-2 d-flex align-items-center gap-1">
          <i class="fas fa-exclamation-circle"></i>
          Phone number is required
        </div>
      </div>

      <!-- Password -->
      <div class="mb-5">
        <label class="form-label fw-medium text-dark">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="fas fa-lock text-muted"></i>
          </span>
          <input type="password" 
                 class="form-control form-control-lg border-start-0"
                 formControlName="password"
                 placeholder="Enter new password (leave blank to keep current)">
        </div>
      </div>

      <!-- Submit Button -->
      <div class="d-grid gap-2">
        <button type="submit" 
                class="btn btn-primary btn-lg rounded-pill fw-medium py-3"
                [disabled]="profileForm.invalid">
          <i class="fas fa-save me-2"></i>
          Update Profile
        </button>
      </div>
    </form>
  </div>
</div>
