<div class="container-fluid">
  <app-page-title title="Chat" [breadcrumbItems]="breadCrumbItems"></app-page-title>
  <div class="d-lg-flex">
    <div class="chat-leftsidebar me-lg-4">
      <div class="py-4 border-bottom">
        <div class="media">
          <div class="align-self-center me-3">
            <img src="/assets/images/logo.svg" class="avatar-xs rounded-circle" alt="">
          </div>
          <div class="media-body">
            <h5 class="font-size-15 mt-0 mb-1">{{ sender }}</h5>
            <p class="text-muted mb-0"><i class="mdi mdi-circle text-success align-middle me-1"></i> Connecté</p>
          </div>
        </div>
      </div>

      <div class="search-box chat-search-box py-4">
        <div class="position-relative">
          <input
  type="text"
  class="form-control"
  placeholder="Rechercher par nom, prénom, ou email..."
  [(ngModel)]="searchText"
/>
          <i class="bx bx-search-alt search-icon"></i>
        </div>
      </div>

      <h5 class="font-size-14 px-3 mb-3">Utilisateurs</h5>
      <ul class="list-unstyled chat-list px-3">
        <li *ngFor="let user of filteredUsers">
          <a href="javascript:void(0);" (click)="chatUsername(user)">
            <div class="media">
              <div class="avatar-xs me-3">
                <span class="avatar-title rounded-circle bg-soft bg-primary text-primary position-relative">
                  {{ user.nom.charAt(0) }}
                  <!-- Notification badge -->
                  <span *ngIf="unreadSenders.has(user.matriculeP)" 
                        class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">New messages</span>
                  </span>
                </span>
              </div>
              <div class="media-body overflow-hidden">
                <h5 class="text-truncate font-size-14 mb-1" 
                [ngClass]="{ 
                  'fw-bold text-danger': unreadSenders.has(user.matriculeP),
                  'text-muted': !unreadSenders.has(user.matriculeP) 
                }">
              {{ user.nom }} {{ user.prenom }}
            </h5>
                <p class="text-truncate mb-0">{{ user.email }}</p>
              </div>
            </div>
          </a>
        </li>
        <li *ngIf="filteredUsers.length === 0" class="text-muted px-3">
          Aucun utilisateur trouvé.
        </li>
      </ul>
    </div>

    <div class="w-100 user-chat">
      <div class="card">
       <div class="p-4 border-bottom d-flex justify-content-between align-items-center">
          <h5 class="font-size-15 mb-1" *ngIf="username">{{ username }}</h5>
        </div>

        <div class="chat-conversation p-3">
          <ngx-simplebar style="height: 470px;" #scrollRef>
            <ul class="list-unstyled">
              <li *ngFor="let data of chatMessagesData" [ngClass]="{ 'right': data.align === 'right' }">
                <div class="conversation-list">
                  <div class="ctext-wrap">
                    <div class="conversation-name">{{ data.sender }}</div>
                    <p>{{ data.content }}</p>
                    
                    <p class="chat-time mb-0">
                      <i class="bx bx-time-five align-middle me-1"></i>
                      {{ data.timestamp | date:'shortTime' }}
                    </p>
                  </div>
                </div>
              </li>
            </ul>
          </ngx-simplebar>
        </div>

        <div class="p-3 chat-input-section">
          <form (ngSubmit)="messageSave()" [formGroup]="formData" class="row">
            <div class="col">
              <input
                type="text"
                class="form-control chat-input"
                placeholder="Entrer votre message..."
                formControlName="message"
                [ngClass]="{'is-invalid': chatSubmit && formData.get('message')?.errors}">
               
     


                
              <div *ngIf="chatSubmit && formData.get('message')?.errors" class="invalid-feedback">
                <span *ngIf="formData.get('message')?.errors?.['required']">Message requis.</span>
              </div>
            </div>
                    <div class="col-auto">
                  <button type="submit" class="btn btn-primary chat-send">
                <i class="mdi mdi-send"></i>
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
